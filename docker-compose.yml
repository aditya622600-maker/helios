services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: helios
      POSTGRES_USER: helios
      POSTGRES_PASSWORD: helios
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helios -d helios"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - helios_postgres:/var/lib/postgresql/data

volumes:
  helios_postgres:
