name: Bug report
description: Report a reproducible defect or data-quality failure.
title: "[Bug] "
body:
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Include run ID, AOI, scenario, source versions, and logs when relevant.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Ranking or demo impact
